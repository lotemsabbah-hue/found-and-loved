<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Found & Loved</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f3ef;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 40px 18px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 38px;
    }

    .tagline {
      margin-top: 8px;
      font-size: 11px;
      color: #888;
      letter-spacing: 1px;
    }

    .post-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .post-header h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .post-header p {
      color: #777;
    }

    .products {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .product {
      background: white;
      padding: 14px;
      border-radius: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .product img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 16px;
      display: block;
    }

    .product h2 {
      font-size: 18px;
      margin: 16px 5px;
    }

    .product a {
      display: block;
      background: #222;
      color: white;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
    }

    .more {
      text-align: center;
      margin-top: 45px;
      padding-top: 30px;
      border-top: 1px solid #ddd;
    }

    .more p {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .more a {
      color: #222;
      font-weight: bold;
    }

    .error {
      background: white;
      padding: 35px 20px;
      border-radius: 20px;
      text-align: center;
    }

    footer {
      margin-top: 45px;
      text-align: center;
      color: #999;
      font-size: 11px;
      line-height: 1.6;
    }
  </style>
</head>


<body>

<main class="container">

  <header>
    <div class="logo">Found & Loved</div>

    <div class="tagline">
      THINGS WORTH FINDING • THINGS YOU'LL LOVE
    </div>
  </header>


  <div id="content"></div>


  <footer>
    חלק מהקישורים באתר הם קישורי שותפים.
    ייתכן שאקבל עמלה על רכישה דרך הקישורים,
    ללא עלות נוספת עבורך.
  </footer>

</main>


<!-- טוען את מאגר המוצרים -->
<script src="./products.js"></script>


<script>

  const content =
    document.getElementById("content");

  const params =
    new URLSearchParams(window.location.search);

  const postId =
    params.get("post");


  // בדיקה שהמאגר נטען ושהפוסט קיים
  if (
    typeof posts === "undefined" ||
    !postId ||
    !posts[postId]
  ) {

    content.innerHTML = `
      <div class="error">

        <h2>לא מצאנו את המוצרים 😕</h2>

        <p style="margin-top:10px;">
          יכול להיות שהקישור אינו תקין.
        </p>

        <p style="margin-top:20px;">
          <a href="/">
            לכל המוצרים ←
          </a>
        </p>

      </div>
    `;

  }

  else {

    const selectedPost =
      posts[postId];


    let productsHTML = "";


    selectedPost.products.forEach(product => {

      productsHTML += `
        <article class="product">

          <img
            src="${product.image}"
            alt="${product.name}"
          >

          <h2>
            ${product.name}
          </h2>

          <a
            href="${product.link}"
            target="_blank"
            rel="noopener sponsored">

            למוצר ב-AliExpress ←

          </a>

        </article>
      `;

    });


    content.innerHTML = `

      <section class="post-header">

        <h1>
          ${selectedPost.title}
        </h1>

        <p>
          ${selectedPost.description}
        </p>

      </section>


      <section class="products">

        ${productsHTML}

      </section>


      <section class="more">

        <p>
          אהבת? יש עוד ❤️
        </p>

        <a href="/">
          למוצרים נוספים שפרסמתי ←
        </a>

      </section>

    `;

  }

</script>

</body>
</html>

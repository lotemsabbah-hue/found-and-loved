<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Found & Loved</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f3ef;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 30px 18px 50px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .tagline {
      margin-top: 7px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #888;
    }

    .post-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .post-title h1 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .post-title p {
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    .products {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .product {
      background: #fff;
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    .product img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 16px;
      background: #eee;
    }

    .product h2 {
      font-size: 18px;
      line-height: 1.5;
      margin: 16px 5px 12px;
    }

    .product-link {
      display: block;
      width: 100%;
      background: #222;
      color: #fff;
      text-decoration: none;
      text-align: center;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
      transition: 0.2s;
    }

    .product-link:hover {
      opacity: 0.85;
    }

    .more {
      margin-top: 45px;
      text-align: center;
      border-top: 1px solid #ddd5ce;
      padding-top: 35px;
    }

    .more h3 {
      font-size: 19px;
      margin-bottom: 15px;
    }

    .more a {
      display: inline-block;
      color: #222;
      font-weight: bold;
      text-decoration: underline;
    }

    .disclosure {
      margin-top: 45px;
      text-align: center;
      color: #999;
      font-size: 11px;
      line-height: 1.6;
    }

    .error {
      text-align: center;
      background: #fff;
      padding: 35px 20px;
      border-radius: 20px;
    }

    .error h2 {
      margin-bottom: 10px;
    }

    .error p {
      color: #777;
      line-height: 1.6;
    }

    .back-home {
      display: inline-block;
      margin-top: 20px;
      color: #222;
      font-weight: bold;
    }
  </style>
</head>


<body>

  <main class="container">

    <header>
      <div class="logo">Found & Loved</div>

      <div class="tagline">
        THINGS WORTH FINDING • THINGS YOU'LL LOVE
      </div>
    </header>


    <section class="post-title" id="postHeader">

      <h1 id="postTitle"></h1>

      <p id="postDescription"></p>

    </section>


    <section
      class="products"
      id="products">
    </section>


    <section
      class="more"
      id="moreSection">

      <h3>אהבת? יש עוד ❤️</h3>

      <a href="index.html">
        למוצרים נוספים שפרסמתי ←
      </a>

    </section>


    <div class="disclosure">
      חלק מהקישורים באתר הם קישורי שותפים.
      ייתכן שאקבל עמלה על רכישה דרך הקישורים,
      ללא עלות נוספת עבורך.
    </div>

  </main>


  <!-- מאגר הפוסטים והמוצרים -->
  <script src="products.js"></script>


  <script>

    // קבלת מזהה הפוסט מהכתובת
    const params =
      new URLSearchParams(window.location.search);

    const postID =
      params.get("post");


    // חיפוש הפוסט בתוך products.js
    const post =
      typeof posts !== "undefined"
        ? posts[postID]
        : null;


    const productsContainer =
      document.getElementById("products");

    const postHeader =
      document.getElementById("postHeader");

    const moreSection =
      document.getElementById("moreSection");


    // אם הפוסט לא קיים
    if (!post) {

      postHeader.innerHTML = `
        <div class="error">

          <h2>
            לא מצאנו את המוצרים 😕
          </h2>

          <p>
            יכול להיות שהקישור אינו תקין
            או שהפוסט כבר לא זמין.
          </p>

          <a
            class="back-home"
            href="index.html">
            לכל המוצרים ←
          </a>

        </div>
      `;

      moreSection.style.display = "none";

    }


    // אם הפוסט קיים
    else {

      document.getElementById("postTitle")
        .textContent = post.title;

      document.getElementById("postDescription")
        .textContent = post.description;


      // יצירת כרטיס לכל מוצר
      post.products.forEach(product => {

        const card =
          document.createElement("article");

        card.className = "product";


        card.innerHTML = `

          <img
            src="${product.image}"
            alt="${product.name}"
            loading="lazy"
          >

          <h2>
            ${product.name}
          </h2>

          <a
            class="product-link"
            href="${product.link}"
            target="_blank"
            rel="noopener sponsored">

            למוצר ב-AliExpress ←

          </a>

        `;


        productsContainer
          .appendChild(card);

      });

    }

  </script>

</body>

</html>

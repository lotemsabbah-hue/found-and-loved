<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Found & Loved</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f4f1;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
      padding: 25px 18px 60px;
    }


    /* =========================
       LOGO
    ========================= */

    .brand-header {
      text-align: center;
      padding: 20px 5px 35px;
    }

    .brand-logo {
      display: inline-block;
    }

    .logo-icon {
      position: relative;
      width: 100px;
      height: 55px;
      margin: 0 auto 2px;
    }

    .roof-left,
    .roof-right {
      position: absolute;
      top: 25px;
      width: 57px;
      height: 3px;
      background: #d99a8b;
    }

    .roof-left {
      left: 2px;
      transform: rotate(-35deg);
    }

    .roof-right {
      right: 2px;
      transform: rotate(35deg);
    }

    .logo-heart {
      position: absolute;
      right: 0;
      top: 0;
      font-size: 29px;
      color: #d99a8b;
      transform: rotate(8deg);
    }

    .brand-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 42px;
      font-weight: 500;
      letter-spacing: -2px;
      direction: ltr;
      white-space: nowrap;
    }

    .brand-name .amp {
      color: #d99a8b;
      font-style: italic;
      padding: 0 3px;
    }

    .brand-divider {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 13px 0 8px;
    }

    .brand-divider .line {
      height: 1px;
      width: 65px;
      background: #d99a8b;
    }

    .brand-divider .heart {
      color: #d99a8b;
      font-size: 12px;
    }

    .brand-tagline {
      direction: ltr;
      font-size: 10px;
      letter-spacing: 5px;
      color: #444;
    }

    .brand-tagline span {
      color: #d99a8b;
    }


    /* =========================
       POST TITLE
    ========================= */

    .post-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .post-header h1 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .post-header p {
      color: #777;
      font-size: 14px;
    }


    /* =========================
       PRODUCTS
    ========================= */

    .products {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .product {
      background: white;
      padding: 13px;
      border-radius: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .product img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 16px;
      display: block;
    }

    .product h2 {
      font-size: 17px;
      margin: 16px 5px;
    }

    .product a {
      display: block;
      background: #222;
      color: white;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .product a:hover {
      background: #d99a8b;
    }


    /* =========================
       MORE PRODUCTS
    ========================= */

    .more {
      text-align: center;
      margin-top: 45px;
      padding-top: 30px;
      border-top: 1px solid #eaded8;
    }

    .more p {
      font-weight: bold;
      margin-bottom: 14px;
    }

    .more a {
      display: inline-block;
      background: #d99a8b;
      color: white;
      padding: 12px 22px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
    }


    /* =========================
       ERROR
    ========================= */

    .error {
      background: white;
      padding: 35px 20px;
      border-radius: 20px;
      text-align: center;
    }

    .error a {
      color: #d99a8b;
      font-weight: bold;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-top: 45px;
      text-align: center;
      color: #aaa;
      font-size: 11px;
    }


    @media (max-width: 480px) {

      .brand-name {
        font-size: 36px;
      }

      .brand-tagline {
        font-size: 9px;
        letter-spacing: 4px;
      }

    }

  </style>
</head>


<body>

<main class="container">


  <!-- LOGO -->

  <header class="brand-header">

    <div class="brand-logo">

      <div class="logo-icon">
        <span class="roof-left"></span>
        <span class="roof-right"></span>
        <span class="logo-heart">♡</span>
      </div>

      <div class="brand-name">
        Found <span class="amp">&</span> Loved
      </div>

      <div class="brand-divider">
        <span class="line"></span>
        <span class="heart">♥</span>
        <span class="line"></span>
      </div>

      <div class="brand-tagline">
        HOME <span>♥</span> LIFE
      </div>

    </div>

  </header>


  <!-- CONTENT -->

  <div id="content"></div>


  <footer>
    Found & Loved ♡
  </footer>


</main>


<script src="./products.js"></script>


<script>

  const content =
    document.getElementById("content");

  const params =
    new URLSearchParams(window.location.search);

  const postId =
    params.get("post");


  /* CHECK POST */

  if (
    typeof posts === "undefined" ||
    !postId ||
    !posts[postId]
  ) {

    content.innerHTML = `

      <div class="error">

        <h2>לא מצאנו את המוצרים 😕</h2>

        <p style="margin-top:10px;">
          יכול להיות שהקישור אינו תקין.
        </p>

        <p style="margin-top:20px;">
          <a href="/">
            לכל המוצרים ←
          </a>
        </p>

      </div>

    `;

  }

  else {

    const selectedPost =
      posts[postId];


    let productsHTML = "";


    selectedPost.products.forEach(product => {

      productsHTML += `

        <article class="product">

          <img
            src="${product.image}"
            alt="${product.name}"
            loading="lazy"
          >

          <h2>
            ${product.name}
          </h2>

          <a
            href="${product.link}"
            target="_blank"
            rel="noopener sponsored">

            למוצר ב-AliExpress ←

          </a>

        </article>

      `;

    });


    content.innerHTML = `

      <section class="post-header">

        <h1>
          ${selectedPost.title}
        </h1>

        <p>
          ${selectedPost.description}
        </p>

      </section>


      <section class="products">

        ${productsHTML}

      </section>


      <section class="more">

        <p>
          אהבת? יש עוד ❤️
        </p>

        <a href="/">
          למוצרים נוספים שפרסמתי ←
        </a>

      </section>

    `;

  }

</script>

</body>
</html>

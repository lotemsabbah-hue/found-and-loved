<!DOCTYPE html1>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Found & Loved</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f3ef;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 40px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 45px;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .tagline {
      margin-top: 8px;
      font-size: 14px;
      color: #777;
      letter-spacing: 1px;
    }

    .intro {
      text-align: center;
      margin-bottom: 35px;
    }

    .intro h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .intro p {
      color: #666;
      line-height: 1.6;
    }

    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .category {
      background: white;
      border-radius: 18px;
      padding: 25px 10px;
      text-align: center;
      text-decoration: none;
      color: #222;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: 0.2s;
    }

    .category:hover {
      transform: translateY(-3px);
    }

    .category-icon {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .category-name {
      font-weight: bold;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>

  <main class="container">

    <header>
      <div class="logo">Found & Loved</div>
      <div class="tagline">THINGS WORTH FINDING • THINGS YOU'LL LOVE</div>
    </header>

    <section class="intro">
      <h1>הדברים ששווה להכיר ✨</h1>
      <p>
        מוצרים שימושיים, מציאות ודברים שפשוט עושים את החיים קצת יותר קלים.
      </p>
    </section>

    <section class="categories">

      <a class="category" href="#">
        <div class="category-icon">🏠</div>
        <div class="category-name">לבית</div>
      </a>

      <a class="category" href="#">
        <div class="category-icon">🍳</div>
        <div class="category-name">למטבח</div>
      </a>

      <a class="category" href="#">
        <div class="category-icon">🚗</div>
        <div class="category-name">לרכב</div>
      </a>

      <a class="category" href="#">
        <div class="category-icon">✨</div>
        <div class="category-name">החיים קלים יותר</div>
      </a>

    </section>

    <footer>
      Found & Loved © 2026
    </footer>

  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Found & Loved</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f3ef;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 35px 18px 60px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-family: Georgia, serif;
      font-size: 38px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .tagline {
      margin-top: 8px;
      font-size: 11px;
      color: #888;
      letter-spacing: 1px;
    }

    .intro {
      text-align: center;
      margin-bottom: 30px;
    }

    .intro h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .intro p {
      color: #777;
      line-height: 1.6;
    }

    /* קטגוריות */

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 30px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category {
      border: none;
      background: white;
      padding: 11px 17px;
      border-radius: 30px;
      white-space: nowrap;
      cursor: pointer;
      font-size: 14px;
      color: #222;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .category.active {
      background: #222;
      color: white;
    }

    /* מוצרים */

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }

    .product img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 13px;
      background: #eee;
    }

    .product h2 {
      font-size: 15px;
      line-height: 1.4;
      margin: 12px 3px;
      flex-grow: 1;
    }

    .product-link {
      display: block;
      background: #222;
      color: white;
      text-decoration: none;
      text-align: center;
      padding: 11px 5px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      background: white;
      border-radius: 18px;
      padding: 35px 15px;
      color: #777;
    }

    footer {
      margin-top: 50px;
      text-align: center;
      color: #999;
      font-size: 11px;
      line-height: 1.6;
    }

    @media (min-width: 600px) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }
    }

  </style>
</head>


<body>

<main class="container">

  <header>

    <div class="logo">
      Found & Loved
    </div>

    <div class="tagline">
      THINGS WORTH FINDING • THINGS YOU'LL LOVE
    </div>

  </header>


  <section class="intro">

    <h1>
      כל המציאות שלי ✨
    </h1>

    <p>
      כל הדברים ששווה להכיר במקום אחד.
      בחרי קטגוריה ותתחילי לגלות.
    </p>

  </section>


  <!-- קטגוריות -->

  <section class="categories">

    <button
      class="category"
      data-category="all">
      ✨ הכל
    </button>

    <button
      class="category"
      data-category="home">
      🏠 לבית
    </button>

    <button
      class="category"
      data-category="kitchen">
      🍳 מטבח
    </button>

    <button
      class="category"
      data-category="car">
      🚗 רכב
    </button>

    <button
      class="category"
      data-category="gadgets">
      💡 גאדג'טים
    </button>

  </section>


  <!-- מוצרים -->

  <section
    class="products"
    id="products">
  </section>


  <footer>

    חלק מהקישורים באתר הם קישורי שותפים.
    ייתכן שאקבל עמלה על רכישה דרך הקישורים,
    ללא עלות נוספת עבורך.

    <br><br>

    Found & Loved © 2026

  </footer>

</main>


<!-- מאגר המוצרים -->
<script src="products.js"></script>


<script>

  const productsContainer =
    document.getElementById("products");


  /*
    אוספים את כל המוצרים מכל הפוסטים
  */

  function getAllProducts() {

    const allProducts = [];

    Object.values(posts).forEach(post => {

      post.products.forEach(product => {

        /*
          לא מציגים אותו מוצר פעמיים
          אם הוא הופיע בכמה פוסטים
        */

        const alreadyExists =
          allProducts.some(item =>
            item.link !== "#" &&
            item.link === product.link
          );

        if (!alreadyExists) {
          allProducts.push(product);
        }

      });

    });

    return allProducts;
  }


  const allProducts = getAllProducts();


  /*
    הצגת מוצרים
  */

  function displayProducts(category = "all") {

    productsContainer.innerHTML = "";


    let filteredProducts = allProducts;


    if (category !== "all") {

      filteredProducts =
        allProducts.filter(product =>
          product.category === category
        );

    }


    if (filteredProducts.length === 0) {

      productsContainer.innerHTML = `
        <div class="empty">
          עדיין לא העליתי מוצרים בקטגוריה הזאת ❤️
        </div>
      `;

      return;
    }


    filteredProducts.forEach(product => {

      const card =
        document.createElement("article");


      card.className = "product";


      card.innerHTML = `

        <img
          src="${product.image}"
          alt="${product.name}"
          loading="lazy"
        >

        <h2>
          ${product.name}
        </h2>

        <a
          class="product-link"
          href="${product.link}"
          target="_blank"
          rel="noopener sponsored">

          למוצר ←

        </a>

      `;


      productsContainer.appendChild(card);

    });

  }


  /*
    מעבר בין קטגוריות
  */

  const buttons =
    document.querySelectorAll(".category");


  buttons.forEach(button => {

    button.addEventListener("click", () => {

      const category =
        button.dataset.category;


      buttons.forEach(btn =>
        btn.classList.remove("active")
      );


      button.classList.add("active");


      displayProducts(category);


      /*
        מעדכן גם את הכתובת
        לדוגמה:
        ?category=car
      */

      const url =
        category === "all"
          ? window.location.pathname
          : `?category=${category}`;


      history.replaceState(
        {},
        "",
        url
      );

    });

  });


  /*
    אם נכנסו ישירות עם category ב-URL
  */

  const params =
    new URLSearchParams(window.location.search);


  const initialCategory =
    params.get("category") || "all";


  const initialButton =
    document.querySelector(
      `[data-category="${initialCategory}"]`
    );


  if (initialButton) {

    initialButton.classList.add("active");

    displayProducts(initialCategory);

  }

  else {

    document
      .querySelector('[data-category="all"]')
      .classList.add("active");

    displayProducts("all");

  }

</script>

</body>
</html>
